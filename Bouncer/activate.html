<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activate Bouncer</title>
  <style>
    /* Single-platform activation page (Firefox settings hand-off — see
       src/activate/index.ts): just the activate button, centered. Theme
       follows the OS; colors match onboarding.html's tab mode. */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    @media (prefers-color-scheme: light) {
      body { background: #e7e9ea; }
    }
    .activate-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #cfd9de;
      border-radius: 9999px;
      padding: 12px 22px;
      background: #ffffff;
      color: #0f1419;
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    /* Filled in by the script; hidden until then so no blank pill flashes. */
    .activate-btn:empty { visibility: hidden; }
    .activate-btn:hover { background: #f7f9f9; }
    .activate-btn:disabled { opacity: 0.6; cursor: default; }
    .platform-icon {
      width: 20px;
      height: 20px;
      display: block;
      flex: none;
    }
  </style>
</head>
<body>
  <button class="activate-btn" id="activateBtn"></button>

  <!-- Brand icons, cloned into the button by dist/activate.js. Same glyphs
       as onboarding.html; kept as inert templates so the script never builds
       SVG markup from strings. -->
  <template id="platformIcon-linkedin">
    <svg class="platform-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path fill="#0A66C2" d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.225 0z"/>
    </svg>
  </template>
  <template id="platformIcon-youtube">
    <svg class="platform-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path fill="#FF0000" d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
    </svg>
  </template>
  <template id="platformIcon-facebook">
    <svg class="platform-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path fill="#0866FF" d="M9.101 23.691v-7.98H6.627v-3.667h2.474v-1.58c0-4.085 1.848-5.978 5.858-5.978.401 0 .955.042 1.468.103a8.68 8.68 0 0 1 1.141.195v3.325a8.623 8.623 0 0 0-.653-.036 26.805 26.805 0 0 0-.733-.009c-.707 0-1.259.096-1.675.309a1.686 1.686 0 0 0-.679.622c-.258.42-.374.995-.374 1.752v1.297h3.919l-.386 2.103-.287 1.564h-3.246v8.245C19.396 23.238 24 18.179 24 12.044c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.628 3.874 10.35 9.101 11.647Z"/>
    </svg>
  </template>
  <script src="browser-polyfill.js"></script>
  <script src="dist/activate.js" type="module"></script>
</body>
</html>
