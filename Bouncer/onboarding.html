<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activate Bouncer on other platforms?</title>
  <style>
    /* Rendered inside an iframe overlaid on x.com by the content script
       (maybeShowPlatformOnboarding in src/content/ui.ts). Theme class is set
       on <body> by src/onboarding/index.ts from the ?theme= query param;
       colors match the guest popup in content.css. */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 26px 24px 22px;
      background: #15202b;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
    }
    body.dim-mode { background: #1e2732; }
    body.light-mode {
      background: #ffffff;
      color: #0f1419;
    }
    h1 {
      margin: 0 0 16px;
      font-size: 16px;
      font-weight: 700;
    }
    .platform-list {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      margin-bottom: 18px;
    }
    .platform-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .platform-row input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: #1d9bf0;
      cursor: pointer;
    }
    .platform-icon {
      width: 18px;
      height: 18px;
      display: block;
      flex: none;
    }
    .platform-experimental {
      font-weight: 400;
      opacity: 0.6;
    }
    .onboarding-done {
      display: block;
      width: 100%;
      border: none;
      border-radius: 9999px;
      padding: 10px 16px;
      background: #1d9bf0;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .onboarding-done:hover { background: #1a8cd8; }
    /* Top-level tab mode (Firefox install flow — see src/onboarding/index.ts):
       the same content rendered as a centered card on a full-page background
       instead of filling an iframe. The card element is intentionally
       unstyled in iframe mode. */
    body.tab-mode {
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
    }
    body.tab-mode .onboarding-card {
      width: min(360px, 100%);
      padding: 26px 24px 22px;
      border-radius: 16px;
      background: #15202b;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
    }
    body.tab-mode.light-mode { background: #e7e9ea; }
    body.tab-mode.light-mode .onboarding-card { background: #ffffff; }
  </style>
</head>
<body>
  <main class="onboarding-card">
    <h1>Activate Bouncer on other platforms?</h1>
    <div class="platform-list" id="platformList"></div>
    <button class="onboarding-done" id="doneBtn">Done</button>
  </main>

  <!-- Brand icons, cloned into the platform rows by dist/onboarding.js.
       Kept as inert templates here so the script never builds SVG markup
       from strings. Paths are the Simple Icons brand glyphs. -->
  <template id="platformIcon-linkedin">
    <svg class="platform-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path fill="#0A66C2" d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.225 0z"/>
    </svg>
  </template>
  <template id="platformIcon-youtube">
    <svg class="platform-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path fill="#FF0000" d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
    </svg>
  </template>
  <script src="browser-polyfill.js"></script>
  <script src="dist/onboarding.js" type="module"></script>
</body>
</html>
